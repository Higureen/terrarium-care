components:
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 5
        total:
          type: integer
          example: 12
        totalPages:
          type: integer
          example: 3
    PageLinks:
      type: object
      properties:
        self:
          type: string
        first:
          type: string
        previous:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
    PetListItem:
      allOf:
      - $ref: '#/components/schemas/Pet'
      - type: object
        properties:
          _links:
            type: object
            properties:
              self:
                type: string
                example: /pets/1
              profile:
                type: string
                example: /pets/1/profile
              terrarium:
                type: string
                example: /terrariums/1
              care_records:
                type: string
                example: /terrariums/1/pets/1/care-records
    Terrarium:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Varlių terariumas
        temperature_min:
          type: string
          example: '22.00'
        temperature_max:
          type: string
          example: '26.00'
        humidity_min:
          type: string
          example: '60.00'
        humidity_max:
          type: string
          example: '80.00'
        last_cleaned:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
          example: Demonstracinis terariumas.
    TerrariumInput:
      type: object
      required:
      - name
      - temperature_min
      - temperature_max
      - humidity_min
      - humidity_max
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Pavadinimas negali būti sudarytas tik iš tarpų.
          example: Demo terariumas
        temperature_min:
          type: number
          minimum: -999.99
          maximum: 999.99
          description: Minimali temperatūra °C. Negali viršyti maksimalios.
          example: 22
        temperature_max:
          type: number
          minimum: -999.99
          maximum: 999.99
          description: Maksimali temperatūra °C.
          example: 26
        humidity_min:
          type: number
          minimum: 0
          maximum: 100
          description: Minimali drėgmė procentais. Negali viršyti maksimalios.
          example: 60
        humidity_max:
          type: number
          minimum: 0
          maximum: 100
          description: Maksimali drėgmė procentais.
          example: 80
        last_cleaned:
          type: string
          format: date
          nullable: true
          example: '2026-10-03'
        notes:
          type: string
          nullable: true
          example: Demonstracinis terariumas.
    CareRecord:
      type: object
      properties:
        id:
          type: integer
          example: 1
        pet_id:
          type: integer
          example: 1
        care_type:
          type: string
          enum:
          - feeding
          - observation
          - other
        performed_at:
          type: string
          format: date-time
          readOnly: true
          description: Laiką automatiškai nustato serveris.
        notes:
          type: string
          example: Augintinis aktyvus, pakitimų nepastebėta.
        created_by:
          type: integer
          nullable: true
          readOnly: true
          description: Įrašo autoriaus ID. Senuose įrašuose gali būti null. Kai kurie sudėtiniai ir hierarchiniai
            atsakymai šio lauko negrąžina.
          example: 1
    CareRecordInput:
      type: object
      required:
      - pet_id
      - care_type
      - notes
      properties:
        pet_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 1
        care_type:
          type: string
          enum:
          - feeding
          - observation
          - other
          example: observation
        notes:
          type: string
          minLength: 1
          description: Pastabos negali būti sudarytos tik iš tarpų.
          example: Augintinis aktyvus, pakitimų nepastebėta.
    Pet:
      type: object
      properties:
        id:
          type: integer
          example: 1
        terrarium_id:
          type: integer
          example: 1
        name:
          type: string
          example: Pupa
        species:
          type: string
          example: Litoria caerulea
        arrival_date:
          type: string
          format: date
          example: '2026-09-01'
        notes:
          type: string
          nullable: true
          example: Aktyvi vakare.
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: Nepavyko gauti augintinių sąrašo.
    User:
      type: object
      required:
      - id
      - name
      - email
      - role
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - worker
          - manager
          - admin
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required:
      - name
      - email
      - password
      description: Rolės pateikti negalima; serveris suteikia worker.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
    LoginInput:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    RefreshInput:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Naujausias login arba refresh atsakyme gautas atnaujinimo žetonas.
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - tokenType
      - user
      properties:
        accessToken:
          type: string
          description: 'HS256 pasirašytas JWT: sub, role, sid, iat, exp, iss, aud. Pagal numatytą konfigūraciją
            galioja 15 min.'
        refreshToken:
          type: string
          description: Atsitiktinis 64 šešioliktainių simbolių žetonas; DB saugoma SHA-256 maiša. Pagal numatytą
            konfigūraciją sesija galioja 7 dienas.
        tokenType:
          type: string
          enum:
          - Bearer
        user:
          $ref: '#/components/schemas/User'
    UserUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - worker
          - manager
          - admin
        is_active:
          type: boolean
    CleaningDateInput:
      type: object
      required:
      - last_cleaned
      additionalProperties: false
      properties:
        last_cleaned:
          type: string
          format: date
          example: '2026-11-01'
          description: Tikra kalendorinė data YYYY-MM-DD formatu.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Įklijuokite accessToken be kabučių ir be Bearer prefikso.
  responses:
    Unauthorized:
      description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra neaktyvi.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Nepakanka teisių atlikti veiksmą.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Netinkami užklausos duomenys.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Vidinė serverio arba duomenų bazės klaida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- bearerAuth: []
