openapi: 3.0.3
info:
  title: TerraCare API
  version: 2.0.0
  description: 'Terariumų, augintinių ir jų priežiūros valdymo API. JWT prieigos žetonas siunčiamas Authorization:
    Bearer antraštėje. Rolės: worker, manager, admin. Atnaujinimo žetonai keičiami kiekvieno atnaujinimo metu; sesijos
    galiojimo pabaiga nepratęsiama. Pavyzdžiai iliustraciniai: ID, slaptažodžiai ir žetonai nėra tikri prisijungimo
    duomenys. Pavyzdžių klaidų tekstas gali skirtis pagal validavimo atvejį.'
servers:
- url: https://terracare-api.onrender.com
  description: Publikuota API
- url: http://localhost:3000
  description: Vietinė API
paths:
  /pets/{id}/profile:
    get:
      tags:
      - Augintiniai
      summary: Gauti augintinio profilį
      description: 'Viename atsakyme sujungiama augintinio informacija, jo terariumas ir priežiūros istorija. Jei
        priežiūros įrašų nėra, care_records yra tuščias masyvas. Prieinama prisijungusiems worker, manager ir admin.
        Prieiga: Prisijungę worker, manager ir admin.'
      parameters:
      - name: id
        in: path
        required: true
        description: Augintinio ID.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      responses:
        '200':
          description: Augintinio profilis iš trijų susijusių esybių
          content:
            application/json:
              schema:
                type: object
                required:
                - pet
                - terrarium
                - care_records
                properties:
                  pet:
                    $ref: '#/components/schemas/Pet'
                  terrarium:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      temperature_min:
                        type: number
                      temperature_max:
                        type: number
                      humidity_min:
                        type: number
                      humidity_max:
                        type: number
                      last_cleaned:
                        type: string
                        format: date
                        nullable: true
                      notes:
                        type: string
                        nullable: true
                  care_records:
                    type: array
                    items:
                      $ref: '#/components/schemas/CareRecord'
              example:
                pet:
                  id: 1
                  terrarium_id: 1
                  name: Pupa
                  species: Litoria caerulea
                  arrival_date: '2026-09-01'
                  notes: Aktyvi vakare.
                terrarium:
                  id: 1
                  name: Demo naudotojas
                  temperature_min: 22
                  temperature_max: 26
                  humidity_min: 60
                  humidity_max: 80
                  last_cleaned: '2026-11-01'
                  notes: Demonstracinės pastabos.
                care_records:
                - id: 1
                  pet_id: 1
                  care_type: feeding
                  performed_at: '2026-11-01T10:00:00.000Z'
                  notes: Augintinis aktyvus, pakitimų nepastebėta.
                  created_by: 1
        '400':
          description: Netinkamas augintinio ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkamas augintinio ID.
        '404':
          description: Augintinis nerastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Augintinis nerastas.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti augintinio profilio.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
  /terrariums/{terrariumId}/pets/{petId}/care-records:
    get:
      tags:
      - Priežiūros įrašai
      summary: Gauti terariumo augintinio priežiūros įrašus
      description: 'Tikrinama, ar terariumas egzistuoja ir ar augintinis priklauso būtent jam. Grąžinama augintinio
        priežiūros istorija nuo naujausių įrašų. Jei istorija tuščia, grąžinamas tuščias masyvas. Prieinama prisijungusiems
        worker, manager ir admin. Prieiga: Prisijungę worker, manager ir admin.'
      parameters:
      - name: terrariumId
        in: path
        required: true
        description: Terariumo ID.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: petId
        in: path
        required: true
        description: Šiam terariumui priklausančio augintinio ID.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      responses:
        '200':
          description: Augintinio priežiūros įrašų sąrašas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareRecord'
              example:
              - id: 1
                pet_id: 1
                care_type: feeding
                performed_at: '2026-11-01T10:00:00.000Z'
                notes: Augintinis aktyvus, pakitimų nepastebėta.
                created_by: 1
        '400':
          description: Netinkamas terariumo arba augintinio ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Terariumo ir augintinio ID turi būti teigiami sveikieji skaičiai.
        '404':
          description: Terariumas nerastas arba augintinis šiame terariume nerastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                terrariumNotFound:
                  summary: Terariumas neegzistuoja
                  value:
                    error: Terariumas nerastas.
                petNotInTerrarium:
                  summary: Augintinis neegzistuoja arba priklauso kitam terariumui
                  value:
                    error: Augintinis šiame terariume nerastas.
              example:
                error: Objektas nerastas.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti augintinio priežiūros įrašų.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
  /terrariums/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Terariumo ID
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    get:
      tags:
      - Terariumai
      summary: Gauti terariumą pagal ID
      responses:
        '200':
          description: Terariumo informacija
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terrarium'
              example:
                id: 1
                name: Varlių terariumas
                temperature_min: '22.00'
                temperature_max: '26.00'
                humidity_min: '60.00'
                humidity_max: '80.00'
                last_cleaned: '2026-11-01'
                notes: Demonstracinis terariumas.
        '400':
          description: Netinkamas terariumo ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkami užklausos duomenys.
        '404':
          description: Terariumas nerastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Terariumas nerastas.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti terariumų sąrašo.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
      description: 'Prieinama prisijungusiems worker, manager ir admin. Prieiga: Prisijungę worker, manager ir admin.'
    put:
      tags:
      - Terariumai
      summary: Atnaujinti terariumą
      description: 'Pakeičia terariumo informaciją. Reikia pateikti pavadinimą ir visas temperatūros bei drėgmės
        ribas. Nepateikus last_cleaned ar notes, jie nustatomi į null. Prieinama tik manager ir admin rolėms. Prieiga:
        Tik manager ir admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerrariumInput'
            example:
              name: Demo terariumas
              temperature_min: 22
              temperature_max: 26
              humidity_min: 60
              humidity_max: 80
              last_cleaned: '2026-10-03'
              notes: Demonstracinis terariumas.
      responses:
        '200':
          description: Terariumas atnaujintas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terrarium'
              example:
                id: 1
                name: Demo terariumas
                temperature_min: '22.0'
                temperature_max: '26.0'
                humidity_min: '60.0'
                humidity_max: '80.0'
                last_cleaned: '2026-10-03'
                notes: Demonstracinis terariumas.
        '400':
          description: Netinkamas ID arba netaisyklingas JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkami užklausos duomenys.
        '404':
          description: Terariumas nerastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Terariumas nerastas.
        '422':
          description: 'Netinkami duomenys: trūksta laukų, netinkami jų tipai, ribos arba data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkami pateikti duomenys.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti terariumų sąrašo.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
        '403':
          description: Nepakanka teisių atlikti veiksmą.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Neturite teisės atlikti šio veiksmo.
    delete:
      tags:
      - Terariumai
      summary: Ištrinti terariumą
      description: 'Galima ištrinti tik terariumą, kuriame nėra augintinių. Prieinama tik manager ir admin rolėms.
        Prieiga: Tik manager ir admin.'
      responses:
        '204':
          description: Terariumas ištrintas. Atsakymo turinio nėra.
        '400':
          description: Netinkamas terariumo ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkami užklausos duomenys.
        '404':
          description: Terariumas nerastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Terariumas nerastas.
        '409':
          description: Terariume yra augintinių
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Terariumo ištrinti negalima, nes jame yra augintinių.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti terariumų sąrašo.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
        '403':
          description: Nepakanka teisių atlikti veiksmą.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Neturite teisės atlikti šio veiksmo.
  /terrariums/{id}/pets:
    get:
      tags:
      - Terariumai
      summary: Gauti konkretaus terariumo augintinius
      description: 'Hierarchinis metodas. Jei terariumas egzistuoja, bet neturi augintinių, grąžinamas tuščias masyvas.
        Jei terariumo nėra, grąžinamas 404. Prieinama prisijungusiems worker, manager ir admin. Prieiga: Prisijungę
        worker, manager ir admin.'
      parameters:
      - name: id
        in: path
        required: true
        description: Terariumo ID
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      responses:
        '200':
          description: Pasirinkto terariumo augintinių sąrašas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
              example:
              - id: 1
                terrarium_id: 1
                name: Pupa
                species: Litoria caerulea
                arrival_date: '2026-09-01'
                notes: Aktyvi vakare.
        '400':
          description: Netinkamas terariumo ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkami užklausos duomenys.
        '404':
          description: Terariumas nerastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Terariumas nerastas.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti terariumo augintinių.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
  /terrariums:
    get:
      tags:
      - Terariumai
      summary: Gauti terariumų sąrašą
      description: 'Grąžina vieną sąrašo puslapį. Galima ieškoti pagal pavadinimo dalį, neatsižvelgiant į raidžių
        dydį. Nesant rezultatų, data yra tuščias masyvas. Prieinama prisijungusiems worker, manager ir admin. Prieiga:
        Prisijungę worker, manager ir admin.'
      parameters:
      - name: page
        in: query
        description: Puslapio numeris nuo 1. Pernelyg didelis page ir limit derinys atmetamas su 400.
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          default: 1
      - name: limit
        in: query
        description: Įrašų skaičius puslapyje.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
      - name: name
        in: query
        description: Terariumo pavadinimo dalis. Negali būti vien tarpai arba turėti nulinį simbolį.
        schema:
          type: string
          minLength: 1
          maxLength: 100
        example: ekspozicija
      responses:
        '200':
          description: Terariumų sąrašo puslapis su navigacijos nuorodomis
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                - _links
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/Terrarium'
                      - type: object
                        properties:
                          _links:
                            type: object
                            properties:
                              self:
                                type: string
                                example: /terrariums/1
                              pets:
                                type: string
                                example: /terrariums/1/pets
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  _links:
                    $ref: '#/components/schemas/PageLinks'
              example:
                data:
                - id: 1
                  name: Varlių terariumas
                  temperature_min: '22.00'
                  temperature_max: '26.00'
                  humidity_min: '60.00'
                  humidity_max: '80.00'
                  last_cleaned: '2026-11-01'
                  notes: Demonstracinis terariumas.
                  _links:
                    self: /terrariums/1
                    pets: /terrariums/1/pets
                pagination:
                  page: 1
                  limit: 5
                  total: 1
                  totalPages: 1
                _links:
                  self: /terrariums?page=1&limit=5
                  first: /terrariums?page=1&limit=5
                  previous: null
                  next: null
        '400':
          description: Netinkami puslapiavimo arba filtravimo parametrai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: page ir limit turi būti teigiami sveikieji skaičiai.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti terariumų sąrašo.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
    post:
      tags:
      - Terariumai
      summary: Sukurti terariumą
      description: 'Temperatūros ir drėgmės minimumai negali viršyti maksimumų. Nepateikus datos ar pastabų, jos
        nustatomos į null. Prieinama tik manager ir admin rolėms. Prieiga: Tik manager ir admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerrariumInput'
            example:
              name: Demo terariumas
              temperature_min: 22
              temperature_max: 26
              humidity_min: 60
              humidity_max: 80
              last_cleaned: '2026-10-03'
              notes: Demonstracinis terariumas.
      responses:
        '201':
          description: Terariumas sukurtas
          headers:
            Location:
              description: Sukurto terariumo adresas
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terrarium'
              example:
                id: 1
                name: Demo terariumas
                temperature_min: '22.0'
                temperature_max: '26.0'
                humidity_min: '60.0'
                humidity_max: '80.0'
                last_cleaned: '2026-10-03'
                notes: Demonstracinis terariumas.
        '400':
          description: Netaisyklingas JSON formatas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netaisyklingas JSON formatas.
        '422':
          description: 'Netinkami duomenys: trūksta laukų, netinkami jų tipai, ribos arba data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkami pateikti duomenys.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Vidinė serverio klaida.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
        '403':
          description: Nepakanka teisių atlikti veiksmą.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Neturite teisės atlikti šio veiksmo.
  /care-records/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Priežiūros įrašo ID
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    get:
      tags:
      - Priežiūros įrašai
      summary: Gauti priežiūros įrašą pagal ID
      responses:
        '200':
          description: Priežiūros įrašo informacija
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareRecord'
              example:
                id: 1
                pet_id: 1
                care_type: feeding
                performed_at: '2026-11-01T10:00:00.000Z'
                notes: Augintinis aktyvus, pakitimų nepastebėta.
                created_by: 1
        '400':
          description: Netinkamas priežiūros įrašo ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Netinkamas priežiūros įrašo ID.
        '404':
          description: Priežiūros įrašas nerastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Priežiūros įrašas nerastas.
        '500':
          description: Serverio klaida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nepavyko gauti priežiūros įrašo.
        '401':
          description: 'Nėra galiojančio žetono: žetonas netinkamas, pasibaigęs, sesija panaikinta arba paskyra
            neaktyvi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Reikalingas galiojantis prisijungimo žetonas.
      description: 'Prieinama prisijungusiems worker, manager ir admin. Prieiga: Prisijungę worker, manager ir admin.'
    put:
      tags:
      - Priežiūros įrašai
      summary: Atnaujinti priežiūros įrašą
      description: 'Būtina pateikti pet_id, care_type ir notes. Įrašo laikas nekeičiamas. worker gali keisti arba
        šalinti tik savo įrašus (created_by sutampa su naudotojo ID). manager ir admin gali tvarkyti visus įrašus.
        Autorius redaguojant nekeičiamas. Prieiga: worker – tik savo įrašai; manager ir admin – visi įrašai.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareRecordInput'
            example:
              pet_id: 1
              care_type: observation
              notes: Augintinis aktyvus, pakitimų nepastebėta.
      responses:
        '200':
          description: Priežiūros įrašas atnaujintas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareRecord'
              example:
                id: 1
